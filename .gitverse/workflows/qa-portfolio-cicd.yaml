name: QA Portfolio CI/CD

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']
  workflow_dispatch:

jobs:
  run-tests-and-deploy:
    name: Run Tests & Deploy Allure Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install JDK 17 and Maven
        run: |
          apt-get update
          apt-get -y install openjdk-17-jdk maven
          java -version
          mvn -version

      - name: Run API Tests
        run: mvn clean test -f api-testing/pom.xml
        continue-on-error: true

      - name: Install Chrome
        run: |
          apt-get update
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          apt-get -y install ./google-chrome-stable_current_amd64.deb
          rm -f google-chrome-stable_current_amd64.deb
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          google-chrome --version

      - name: Run UI Tests
        run: mvn clean test -f ui-testing/pom.xml
        continue-on-error: true

      - name: Merge Allure Results
        run: |
          mkdir -p allure-results
          cp -r api-testing/target/allure-results/* allure-results/ 2>/dev/null || true
          cp -r ui-testing/target/allure-results/* allure-results/ 2>/dev/null || true
          echo "Merged files count: $(ls -1 allure-results/ | wc -l)"

      - name: Generate Allure Report
        run: |
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          curl -sSL https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.zip -o allure.zip
          unzip -q allure.zip -d ./allure
          export PATH=$PATH:$(pwd)/allure/allure-2.25.0/bin
          allure generate allure-results --clean -o allure-report

      - name: Deploy Allure Report to Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          cd allure-report
          git init
          git config user.name "gitverse-actions"
          git config user.email "actions@gitverse.ru"
          git remote add origin "https://x-access-token:${{ github.token }}@gitverse.ru/${{ github.repository }}.git"
          git checkout -b gh-pages
          touch .nojekyll
          git add .
          git commit -m "Deploy Allure Report [skip ci]"
          git push origin gh-pages --force
